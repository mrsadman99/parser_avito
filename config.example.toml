# ============================================================
# Пример конфигурации Avito Parser — БЕЗ секретов (для git)
#
# Скопируйте этот файл в config.toml и заполните своими данными:
#   cp config.example.toml config.toml
#
# ВАЖНО: config.toml добавлен в .gitignore и НЕ пушится в git.
# Заполненные токены/ключи/пароли никогда не должны попадать в репозиторий.
# ============================================================

[avito]
# --- Ссылки для мониторинга ---
# Ссылки задаются в секции [avito.links] в конце файла.
# Для каждой ссылки можно указать цену, город, дату, ключевые слова и флаги.
count = 1                            # сколько страниц объявлений брать за проход

# --- Глобальные (не по ссылкам) ---
seller_black_list = []               # чёрный список продавцов

# --- Обход блокировок (SPFA / cookies) ---
use_webdriver = true                 # использовать браузер (Playwright)
use_bypass_api = false               # true — использовать SPFA (spfa.pro)
cookies_api_key = ""                 # API-ключ SPFA
use_own_cookies = false              # true — свои cookies (scripts/get_cookies_cli.py)
purchase_cooldown = 600              # пауза между покупками cookies SPFA, сек
parse_phone = false                  # парсить телефоны (функция пока не активна)

# --- Паузы и повторы ---
pause_general = 300                  # пауза до нового цикла обхода одной ссылки, сек
min_delay = 1.0                      # мин. задержка между запросами к Avito, сек
max_delay = 3.0                      # макс. задержка между запросами к Avito, сек
max_count_of_retry = 5               # макс. повторов запроса
retry_delay = 5                      # пауза между повторами, сек
timeout = 20                         # таймаут запроса, сек
block_threshold = 3                  # блокировок до «обработки бана»

# --- Фоновый режим ---
detached_mode = false                # true — прокси/парсер/API в фоне (detached), false — в tmux

# --- Полные описания ---
open_full_ad = false                 # открывать страницы ради полного описания


# --- Веб-приложение (server/ + web-server/, запуск: python run.py) ---
[avito.server]
server_port = 8000                   # порт REST API + фронтенд
web_server_port = 3000               # порт React dev-сервера (только python run.py --dev)
admin_password = ""                  # пароль для входа админа (логин: admin)
server_host = "127.0.0.1"            # интерфейс API; 0.0.0.0 — слушать наружу (лучше за reverse-proxy)
cors_origins = []                    # доп. разрешённые origins, напр. ["https://example.com"]


# --- Camoufox (реальный браузер для запросов к поиску) ---
[avito.camoufox]
use = false                          # true — поиск через Camoufox вместо curl_cffi
os = "windows"                       # десктопный отпечаток: windows / macos / linux
headless = true                      # запускать браузер без окна
humanize = true                      # человеческие движения курсора
geoip = true                         # гео/locale под IP прокси (нужен [geoip])


# --- Свой мобильный прокси (tinyproxy на телефоне через SSH, без adb) ---
# tinyproxy запускается на телефоне по SSH через `nohup` (без tmux) и живёт
# независимо от SSH-сессии. При каждом запуске старый процесс останавливается.
# Порты НЕ пробрасываются: адрес прокси = {server}:{port} (пусто = ssh.host),
# парсер обращается туда напрямую. На телефоне: pkg install tinyproxy openssh.
[avito.own_mobile_proxy]
use = false                          # true — трафик через телефон (свой мобильный прокси)
port = 8888                          # порт tinyproxy на телефоне
rotate_ip = true                     # смена IP через airplane mode при блокировке
login = ""                           # опционально: логин HTTP (tinyproxy BasicAuth)
password = ""                        # опционально: пароль HTTP (tinyproxy BasicAuth)
server = ""                          # адрес прокси (host или host:port) для парсера и SPFA; пусто = ssh.host

# SSH-подключение к телефону (запуск/остановка tinyproxy)
[avito.own_mobile_proxy.ssh]
host = ""                            # IP-адрес телефона
port = 8022                          # порт SSH (у Termux sshd по умолчанию 8022)
user = ""                            # пользователь SSH (в Termux — имя из `whoami`)
password = ""                        # пароль SSH


# --- Внешний мобильный прокси (платный сервис) ---
[avito.external_mobile_proxy]
proxy_string = ""                    # формат: логин:пароль@хост:порт
# Ссылки смены IP (changeip), например:
#   "https://changeip.mobileproxy.space/?proxy_key=***"
# Перебираются по порядку, пока запрос не выполнится успешно.
change_urls = []


# --- Мессенджеры для отправки обработанных объявлений ---
[avito.messengers]
tg_token = ""                        # токен бота от @BotFather
tg_chat_id = []                      # chat_id получателей (можно несколько)
vk_token = ""                        # ключ API сообщества VK
vk_user_id = []                      # ID получателей VK
proxy_notifier = ""                  # прокси для Telegram/смены IP (формат: login:pass@host:port)


# ============================================================
# Ссылки для мониторинга (ключ = ссылка, значение = объект)
#
# Для каждой ссылки можно задать (всё опционально):
#   min_price / max_price   — диапазон цены
#   white_list / black_list — ключевые слова (оставить / исключить)
#   geo                     — город (фильтр по региону)
#   start_date              — дата "YYYY-MM-DD", с которой искать объявления
#   ignore_reserv           — true пропускать «Зарезервировано» (по умолчанию true)
#   ignore_promotion        — true пропускать продвигаемые
#   "ссылка" = {}           — без ограничений
# ============================================================
[avito.links]
"https://www.avito.ru/novosibirsk/nastolnye_kompyutery?q=игровой+пк" = {}
# "https://www.avito.ru/novosibirsk/videokarty?q=rtx" = { min_price = 10000, max_price = 50000, white_list = ["rtx"], black_list = ["сломан"], geo = "Новосибирск", start_date = "2026-01-01", ignore_promotion = true }
# "https://www.avito.ru/novosibirsk/noutbuki?q=macbook" = { max_price = 80000, ignore_reserv = false }

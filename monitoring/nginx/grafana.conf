# Install as /etc/nginx/conf.d/grafana.conf on the Docker host.
# This file must be included inside nginx's http {} block.
# Public URL: http://90.189.153.8:8888/
# monitoring/.env:
#   GRAFANA_BIND_ADDRESS=127.0.0.1
#   GRAFANA_PORT=3001
#   GRAFANA_ROOT_URL=http://90.189.153.8:8888/

map $http_upgrade $avito_grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    server_name 90.189.153.8;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $avito_grafana_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

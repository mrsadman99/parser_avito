apiVersion: 1
datasources:
  - name: Avito Loki
    uid: avito-loki
    type: loki
    access: proxy
    url: http://log-gateway:8080
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: CatalogJSON
          matcherRegex: 'catalog_snapshot=([0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{12}_[a-f0-9]{32}\.json)'
          url: '${GF_SERVER_ROOT_URL}api/datasources/proxy/uid/avito-loki/snapshots/$${__value.raw}'
          urlDisplayLabel: 'Открыть полный JSON'

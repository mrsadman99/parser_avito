# Internal-only datasource gateway. Grafana authenticates /api/datasources/proxy/uid/...
# before forwarding either a Loki request or a saved catalog response here.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ "^/snapshots/([0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{12}_[a-f0-9]{32}\.json)$" {
        alias /var/log/avito/catalog_responses/$1;
        default_type application/json;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        disable_symlinks on;
        limit_except GET { deny all; }
    }

    # No directory listings, temporary files, other logs or arbitrary paths.
    location /snapshots { return 404; }

    location / {
        set $loki_backend http://loki:3100;
        proxy_pass $loki_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
